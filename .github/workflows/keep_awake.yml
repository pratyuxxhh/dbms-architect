name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          URL="https://dbms-architect-2.onrender.com/public/test"

          echo "Pinging $URL..."

          HTTP_CODE=$(curl \
            --location \
            --silent \
            --show-error \
            --max-time 180 \
            --output response.txt \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response:"
          cat response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Request failed!"
            exit 1
          fi
