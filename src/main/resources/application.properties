spring.application.name=buildmyschema
string.test=${STRING_TEST}


spring.datasource.url=jdbc:mariadb://localhost:3330/dbms_architect
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect


spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.4-nano
spring.ai.openai.chat.options.max-completion-tokens=4096
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.dimensions=1536



logging.level.org.springframework.ai.chat.client.advisor=DEBUG